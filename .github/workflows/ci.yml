name: Build and Test

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*" ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "instructions/**"
  pull_request:
    branches: [ "main", "develop" ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "instructions/**"

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Check formatting
        run: dotnet format src/TextServices.sln --verify-no-changes --severity warn

  build-and-test:
    runs-on: ubuntu-latest
    needs: format

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore src/TextServices.sln

      - name: Build
        run: dotnet build src/TextServices.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test src/TextServices.sln --no-build --configuration Release

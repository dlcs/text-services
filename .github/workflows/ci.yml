name: Build and Test

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*" ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "instructions/**"
  pull_request:
    branches: [ "main", "develop" ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "instructions/**"

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Check formatting
        run: dotnet format src/TextServices.sln --verify-no-changes --severity warn

      - name: Check analyzers
        run: dotnet format analyzers src/TextServices.sln --verify-no-changes --severity warn

  build-and-test:
    runs-on: ubuntu-latest
    needs: format

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore src/TextServices.sln

      - name: Build
        run: dotnet build src/TextServices.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test src/TextServices.sln --no-build --configuration Release

  build-push-images:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: (github.event.pull_request.draft != true || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-image')))
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: text-services-builder
            dockerfile: Dockerfile.Builder
          - name: text-services-search
            dockerfile: Dockerfile.Search

    steps:
      - uses: actions/checkout@v6

      - name: Build and push ${{ matrix.name }}
        uses: ./.github/actions/docker-build-and-push
        with:
          image-name: ${{ matrix.name }}
          dockerfile: ${{ matrix.dockerfile }}
          context: .
          github-token: ${{ secrets.GITHUB_TOKEN }}

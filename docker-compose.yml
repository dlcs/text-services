volumes:
  txt_postgres_data: {}
  txt_postgres_data_backups: {}
  txt_textservices_data: {}

services:
  postgres:
    image: postgres:18
    hostname: postgres
    ports:
      - "5452:5432"
    volumes:
      - txt_postgres_data:/var/lib/postgresql/docker
      - txt_postgres_data_backups:/backups
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=txt_password

  builder:
    build:
      context: .
      dockerfile: Dockerfile.Builder
    ports:
      - "5283:8080"
    depends_on:
      - postgres
    volumes:
      - txt_textservices_data:/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RunMigrations=true
      - ConnectionStrings__BuilderDb=Host=postgres;Port=5432;Database=postgres;Username=postgres;Password=txt_password
      - TextServices__SearchApiBaseUrl=http://localhost:5294
      - TextServices__Storage__FileSystem__RootPath=/data
      - CorsAllowedOrigins__0=http://localhost:5100

  search:
    build:
      context: .
      dockerfile: Dockerfile.Search
    ports:
      - "5294:8080"
    volumes:
      - txt_textservices_data:/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - TextServices__BaseUrl=http://localhost:5294
      - TextServices__Storage__FileSystem__RootPath=/data
      - CorsAllowedOrigins__0=http://localhost:5100

  demo:
    build:
      context: .
      dockerfile: Dockerfile.Demo
    ports:
      - "5100:8080"
    environment:
      - Demo__BuilderApiBaseUrl=http://localhost:5283
      - Demo__SearchApiBaseUrl=http://localhost:5294

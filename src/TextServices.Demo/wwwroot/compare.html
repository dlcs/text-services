<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Comparator — TextServices Demo</title>
  <link rel="stylesheet" href="/demo.css">
</head>
<body>
<nav>
  <a class="brand" href="/">TextServices Demo</a>
  <a href="/builder.html">Builder</a>
  <a href="/sourcedata.html">Source Data</a>
  <a href="/viewer.html">Viewer</a>
  <a href="/compare.html">Compare</a>
  <a href="/figures.html">Figures</a>
  <a href="/annotations.html">Annotations</a>
</nav>
<main>
  <h1>Search Comparator</h1>
  <p style="font-size:0.88rem;color:#555;margin-top:0">
    Load a manifest with search services to compare autocomplete and search results side by side.
    Text-augmented manifests include both v2 and v1 services.
  </p>

  <div class="row" style="margin-bottom:0.8rem">
    <input type="url" id="manifest-url" placeholder="IIIF Manifest URL (v3)" />
    <button id="load-btn">Load</button>
  </div>

  <div id="error-area"></div>

  <div id="compare-ui" style="display:none">
    <div class="info-box" id="services-info"></div>

    <div class="row" style="margin-bottom:0.8rem;max-width:500px">
      <input type="text" id="query-input" placeholder="Search term…" autocomplete="off" />
      <button id="search-btn">Search</button>
    </div>

    <div class="compare-columns" id="compare-columns">
      <!-- Columns are built dynamically by compare.js -->
    </div>
  </div>
</main>
<script type="module" src="/js/compare.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Comparator — TextServices Demo</title>
  <link rel="stylesheet" href="/demo.css">
</head>
<body>
<nav>
  <a class="brand" href="/builder.html">TextServices Demo</a>
  <a href="/builder.html">Builder</a>
  <a href="/viewer.html">Viewer</a>
  <a href="/compare.html">Compare</a>
</nav>
<main>
  <h1>Search Comparator</h1>
  <p style="font-size:0.88rem;color:#555;margin-top:0">
    Load a manifest that has two search services to compare their autocomplete and search results side by side.
  </p>

  <div class="row" style="margin-bottom:0.8rem">
    <input type="url" id="manifest-url" placeholder="IIIF Manifest URL (v3)" />
    <button id="load-btn">Load</button>
  </div>

  <div id="error-area"></div>

  <div id="compare-ui" style="display:none">
    <div class="info-box" id="services-info"></div>

    <div class="row" style="margin-bottom:0.8rem;max-width:500px">
      <input type="text" id="query-input" placeholder="Search term…" autocomplete="off" />
      <button id="search-btn">Search</button>
    </div>

    <div class="compare-columns" id="compare-columns">
      <div class="compare-col" id="col-a">
        <h3 id="label-a">Service A</h3>
        <div class="latency" id="latency-a"></div>
        <div id="ac-a"><strong style="font-size:0.8rem">Autocomplete</strong><ul class="ac-list" id="ac-list-a"></ul></div>
        <div id="results-a"><strong style="font-size:0.8rem">Search results</strong><div id="results-list-a"></div></div>
        <div class="thumb-grid" id="thumbs-a"></div>
      </div>
      <div class="compare-col" id="col-b">
        <h3 id="label-b">Service B</h3>
        <div class="latency" id="latency-b"></div>
        <div id="ac-b"><strong style="font-size:0.8rem">Autocomplete</strong><ul class="ac-list" id="ac-list-b"></ul></div>
        <div id="results-b"><strong style="font-size:0.8rem">Search results</strong><div id="results-list-b"></div></div>
        <div class="thumb-grid" id="thumbs-b"></div>
      </div>
    </div>
  </div>
</main>
<script type="module" src="/js/compare.js"></script>
</body>
</html>
